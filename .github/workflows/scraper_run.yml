name: GreenUz Auto Scraper

on:
  schedule:
    - cron: '0 0 * * *' # Авто-запуск каждую ночь в 00:00
  workflow_dispatch:   # Кнопка для ручного запуска

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper Script
      run: python scraper.py

    - name: Commit and Push changes
      run: |
        git config --global user.name 'GreenUz-Bot'
        git config --global user.email 'bot@green.uz'
        git add .
        git commit -m "Авто-обновление данных карты" || echo "Нет изменений"
        git push
